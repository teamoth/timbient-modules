<!doctype html>
<!-- The home page's layout. Its words are in home.md: the build puts them in here ({{...}}) to make the page. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE_TEXT}}</title>
<meta name="description" content="{{TAGLINE_TEXT}}">
<meta name="theme-color" content="#e8eef5">
<link rel="icon" href="home/icon-192.png">
<link rel="apple-touch-icon" href="home/icon-192.png">
<meta property="og:title" content="{{TITLE_TEXT}}">
<meta property="og:description" content="{{TAGLINE_TEXT}}">
<meta property="og:image" content="https://teamoth.github.io/timbient-modules/home/screenshot.png">
<style>
  /* The app's own default look: pale blue-grey, dark text, the icon's cyan, amber and pink as small accents */
  :root { --bg: #e8eef5; --panel: #f7f9fc; --line: #c9d3df; --ink: #1f2329; --mid: #555d69; --blue: #2f5f8f; --cyan: #59c3e8; --amber: #f2a541; --pink: #e86f8a; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
  a { color: var(--blue); }
  a:hover { color: #173d63; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 24px; }
  header { padding: 56px 0 36px; display: grid; grid-template-columns: auto 1fr; gap: 28px; align-items: center; }
  header img { width: 128px; height: 128px; }
  h1 { margin: 0 0 8px; font-size: clamp(28px, 5vw, 42px); line-height: 1.15; font-weight: 700; }
  .tag { margin: 0; color: var(--mid); font-size: 17px; max-width: 46em; }
  .get { display: grid; grid-template-columns: repeat(3, minmax(0, 220px)); gap: 14px; margin: 0 0 14px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 48px; padding: 12px 20px; border-radius: 4px; text-decoration: none; font-weight: 700; font-size: 16px; background: var(--blue); color: #fff; }
  .btn:hover { background: #224a72; color: #fff; }
  .btn svg { width: 18px; height: 18px; }
  .small { color: var(--mid); font-size: 14px; margin: 0 0 40px; }
  .small a { color: var(--mid); }
  .small a:hover { color: var(--ink); }
  figure { margin: 0 0 48px; }
  figure a { display: block; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: #e8eef5; box-shadow: 0 2px 10px rgba(31, 35, 41, 0.08); }
  figure img { display: block; width: 100%; height: auto; }
  figcaption { color: var(--mid); font-size: 13px; margin-top: 10px; }
  .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; margin: 0 0 56px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 22px 24px; }
  .card h2 { margin: 0 0 10px; font-size: 17px; }
  .card h2 span { display: inline-block; width: 9px; height: 9px; margin-right: 9px; border-radius: 2px; }
  .card p { margin: 0 0 12px; font-size: 15px; }
  .card p:last-child { margin-bottom: 0; }
  .quiet { color: var(--mid); font-size: 14px; }
  code.inline { display: inline; padding: 1px 5px; margin: 0; white-space: normal; }
  code { display: block; margin: 10px 0 0; padding: 10px 12px; background: #eef2f7; border: 1px solid var(--line); border-radius: 4px; color: #7a4a06; font-size: 13px; overflow-x: auto; white-space: pre; }
  footer { border-top: 1px solid var(--line); padding: 22px 0 40px; color: var(--mid); font-size: 14px; display: flex; flex-wrap: wrap; gap: 8px 24px; }
  footer a { color: var(--mid); }
  footer a:hover { color: var(--ink); }
  @media (max-width: 700px) {
    header { grid-template-columns: 1fr; gap: 18px; padding-top: 36px; }
    header img { width: 96px; height: 96px; }
    .get { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="home/icon-256.png" alt="Timbient Modules icon: the letters TM made of twisted patch cables" width="128" height="128">
    <div>
      <h1>{{TITLE}}</h1>
      <p class="tag">{{TAGLINE}}</p>
    </div>
  </header>

  <div class="get">
    <a class="btn" href="https://github.com/teamoth/timbient-modules/releases/download/latest/Timbient-Modules-Windows.zip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Windows</a>
    <a class="btn" href="https://github.com/teamoth/timbient-modules/releases/download/latest/Timbient-Modules-Mac.zip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Mac</a>
    <a class="btn" href="https://github.com/teamoth/timbient-modules/releases/download/latest/Timbient-Modules-Linux.tar.gz"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Linux</a>
  </div>
  <p class="small">{{BELOW_BUTTONS}}</p>

  <figure>
    <a href="home/screenshot.png"><img src="home/screenshot.png" width="3360" height="2100" alt="Timbient Modules with a session open: sequencers, a note looper, pluck and pad voices, a resonator, echo, reverb and a grain looper, joined by patch cables"></a>
  </figure>

  <div class="cols">
{{SECTIONS}}
  </div>

  <footer>
    <span>Timbient Modules</span>
    <a href="https://github.com/teamoth/timbient-modules">Source on GitHub</a>
    <a href="CREDITS.md">Credits</a>
  </footer>
</div>
</body>
</html>
