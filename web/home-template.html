<!doctype html>
<!-- The home page's layout. Its words are in home.md: the build puts them in here ({{...}}) to make the page. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE_TEXT}}</title>
<meta name="description" content="{{TAGLINE_TEXT}}">
<meta name="theme-color" content="#e8eef5">
<link rel="icon" href="home/icon-192.png">
<link rel="apple-touch-icon" href="home/icon-192.png">
<meta property="og:title" content="{{TITLE_TEXT}}">
<meta property="og:description" content="{{TAGLINE_TEXT}}">
<meta property="og:image" content="https://teamoth.github.io/timbient-modules/home/screenshot.png">
<style>
  /* The app's own default look: pale blue-grey, dark text, the icon's cyan, amber and pink as small accents */
  :root { --bg: #e8eef5; --panel: #f7f9fc; --line: #c9d3df; --ink: #1f2329; --mid: #555d69; --blue: #2f5f8f; --cyan: #59c3e8; --amber: #f2a541; --pink: #e86f8a; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
  a { color: var(--blue); }
  a:hover { color: #173d63; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 24px; }
  header { padding: 56px 0 36px; display: grid; grid-template-columns: auto 1fr; gap: 28px; align-items: center; }
  header img { width: 128px; height: 128px; }
  h1 { margin: 0 0 8px; font-size: clamp(28px, 5vw, 42px); line-height: 1.15; font-weight: 700; }
  .tag { margin: 0; color: var(--mid); font-size: 17px; max-width: 46em; }
  .get { display: grid; grid-template-columns: repeat(3, minmax(0, 220px)); gap: 14px; margin: 0 0 14px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 48px; padding: 12px 20px; border-radius: 4px; text-decoration: none; font-weight: 700; font-size: 16px; background: var(--blue); color: #fff; }
  .btn:hover { background: #224a72; color: #fff; }
  .btn svg { width: 18px; height: 18px; }
  .small { color: var(--mid); font-size: 14px; margin: 0 0 40px; }
  .small a { color: var(--mid); }
  .small a:hover { color: var(--ink); }
  figure { margin: 0 0 48px; }
  figure a { display: block; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: #e8eef5; box-shadow: 0 2px 10px rgba(31, 35, 41, 0.08); }
  figure img { display: block; width: 100%; height: auto; }
  figcaption { color: var(--mid); font-size: 13px; margin-top: 10px; }
  .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; margin: 0 0 56px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 22px 24px; }
  .card h2 { margin: 0 0 10px; font-size: 17px; }
  .card h2 span { display: inline-block; width: 9px; height: 9px; margin-right: 9px; border-radius: 2px; }
  .card p { margin: 0 0 12px; font-size: 15px; }
  .card p:last-child { margin-bottom: 0; }
  .quiet { color: var(--mid); font-size: 14px; }
  code.inline { display: inline; padding: 1px 5px; margin: 0; white-space: normal; }
  code { display: block; margin: 10px 0 0; padding: 10px 12px; background: #eef2f7; border: 1px solid var(--line); border-radius: 4px; color: #7a4a06; font-size: 13px; overflow-x: auto; white-space: pre; }
  footer { border-top: 1px solid var(--line); padding: 22px 0 40px; color: var(--mid); font-size: 14px; display: flex; flex-wrap: wrap; gap: 8px 24px; }
  footer a { color: var(--mid); }
  footer a:hover { color: var(--ink); }
  /* Send feedback: a small form over the page */
  .linkbtn { font: inherit; color: var(--mid); background: none; border: 0; padding: 0; text-decoration: underline; cursor: pointer; }
  .linkbtn:hover { color: var(--ink); }
  .modal { position: fixed; inset: 0; z-index: 20; background: rgba(31, 35, 41, 0.45); display: grid; place-items: center; padding: 16px; }
  .modal[hidden] { display: none; }
  .modalcard { width: min(520px, 100%); max-height: 100%; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 20px 22px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 8px 30px rgba(31, 35, 41, 0.25); }
  .modalcard h2 { margin: 0; font-size: 19px; display: flex; justify-content: space-between; align-items: center; }
  .modalcard .x { font: inherit; font-size: 18px; background: none; border: 0; color: var(--mid); cursor: pointer; min-width: 44px; min-height: 44px; }
  .modalcard p { margin: 0; font-size: 14px; color: var(--mid); }
  .modalcard label { font-size: 14px; font-weight: 700; margin-top: 4px; }
  .modalcard textarea, .modalcard input[type=text], .modalcard input[type=email] { font: inherit; font-size: 15px; background: #fff; color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; width: 100%; }
  .modalcard textarea { min-height: 140px; resize: vertical; }
  .modalcard .details { font-size: 13px; background: #eef2f7; border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; }
  .modalcard .details label { font-weight: 400; display: flex; gap: 8px; align-items: flex-start; margin: 0; }
  .modalcard .btns { display: flex; gap: 10px; margin-top: 6px; }
  .modalcard .btns button { font: inherit; font-weight: 700; min-height: 44px; padding: 10px 20px; border-radius: 4px; cursor: pointer; border: 1px solid var(--line); background: #fff; color: var(--ink); }
  .modalcard .btns button.send { background: var(--blue); border-color: var(--blue); color: #fff; }
  .modalcard .btns button:disabled { opacity: 0.6; cursor: default; }
  .hp { position: absolute; left: -9999px; opacity: 0; }
  @media (max-width: 700px) {
    header { grid-template-columns: 1fr; gap: 18px; padding-top: 36px; }
    header img { width: 96px; height: 96px; }
    .get { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="home/icon-256.png" alt="Timbient Modules icon: the letters TM made of twisted patch cables" width="128" height="128">
    <div>
      <h1>{{TITLE}}</h1>
      <p class="tag">{{TAGLINE}}</p>
    </div>
  </header>

  <div class="get">
    <a class="btn" href="https://github.com/teamoth/timbient-modules/releases/download/latest/Timbient-Modules-Windows.zip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Windows</a>
    <a class="btn" href="https://github.com/teamoth/timbient-modules/releases/download/latest/Timbient-Modules-Mac.zip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Mac</a>
    <a class="btn" href="https://github.com/teamoth/timbient-modules/releases/download/latest/Timbient-Modules-Linux.tar.gz"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Linux</a>
  </div>
  <p class="small">{{BELOW_BUTTONS}}</p>

  <figure>
    <a href="home/screenshot.png"><img src="home/screenshot.png" width="3360" height="2100" alt="Timbient Modules with a session open: sequencers, a note looper, pluck and pad voices, a resonator, echo, reverb and a grain looper, joined by patch cables"></a>
  </figure>

  <div class="cols">
{{SECTIONS}}
  </div>

  <footer>
    <span>timbient modules</span>
    <a href="https://github.com/teamoth/timbient-modules">Source on GitHub</a>
    <a href="CREDITS.md">Credits</a>
    <button type="button" class="linkbtn" id="feedbackbtn">Send feedback</button>
  </footer>
</div>

<div class="modal" id="feedback" hidden role="dialog" aria-modal="true" aria-labelledby="fbtitle">
  <form class="modalcard" id="fbform" novalidate>
    <h2><span id="fbtitle">Send feedback</span><button type="button" class="x" id="fbclose" aria-label="Close">&#x2715;</button></h2>
    <p>Comments, ideas or bugs: they go straight to the developer. Add your email if you'd like a reply.</p>
    <div id="fbfields" style="display: flex; flex-direction: column; gap: 6px">
      <label for="fbmsg">Message</label>
      <textarea id="fbmsg" name="message" required maxlength="4000" placeholder="What's on your mind?"></textarea>
      <label for="fbname">Name (optional)</label>
      <input id="fbname" name="name" type="text" maxlength="80" autocomplete="name">
      <label for="fbemail">Email, for a reply (optional)</label>
      <input id="fbemail" name="email" type="email" maxlength="120" autocomplete="email">
      <div class="details" id="fbdetails" hidden><label><input type="checkbox" id="fbincl" checked> <span>Include these details from the app (they help with bugs): <span id="fbdtext"></span></span></label></div>
      <input type="checkbox" name="botcheck" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
      <div class="h-captcha" data-captcha="true"></div>
    </div>
    <p id="fbstatus" role="status"></p>
    <div class="btns"><button type="submit" class="send" id="fbsend">Send</button><button type="button" id="fbcancel">Cancel</button></div>
  </form>
</div>
<script>
/* Send feedback: messages go through Web3Forms (web3forms.com), which forwards them to the developer's inbox.
   The access key is public by design: it can only send messages to that inbox, and hCaptcha keeps bots out.
   The app opens this page as .../#feedback?v=...&os=... with its version and set-up, shown and sent if left ticked. */
(function () {
  const FEEDBACK = { key: "99f7be95-088b-49ac-a1e2-81d2666c06c5", endpoint: "https://api.web3forms.com/submit" };
  const $ = (id) => document.getElementById(id);
  let captchaLoaded = false, details = "";
  function open() {
    $("feedback").hidden = false; $("fbstatus").textContent = "";
    if (!captchaLoaded) { captchaLoaded = true; const sc = document.createElement("script"); sc.src = "https://web3forms.com/client/script.js"; sc.async = true; sc.defer = true; document.body.append(sc); }
    setTimeout(() => $("fbmsg").focus(), 50);
  }
  function close() { $("feedback").hidden = true; if (location.hash.startsWith("#feedback")) history.replaceState(null, "", location.pathname); }
  // from the app: its details (version, system, sound, MIDI), after #feedback?
  const h = location.hash;
  if (h.startsWith("#feedback")) {
    const q = new URLSearchParams(h.slice(h.indexOf("?") + 1)); const parts = [];
    for (const [k, label] of [["v", "version"], ["os", "system"], ["audio", "sound"], ["buf", "buffer"], ["rate", "rate"], ["midi", "MIDI devices"]]) { const v = q.get(k); if (v) parts.push(label + " " + v.slice(0, 80)); }
    details = parts.join(", ");
    if (details) { $("fbdetails").hidden = false; $("fbdtext").textContent = details; }
    open();
  }
  $("feedbackbtn").onclick = open; $("fbclose").onclick = close; $("fbcancel").onclick = close;
  $("feedback").addEventListener("click", (e) => { if (e.target.id === "feedback") close(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("feedback").hidden) close(); });
  $("fbform").addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = e.target, st = $("fbstatus"), send = $("fbsend");
    if (!f.message.value.trim()) { st.textContent = "Please write a message first."; f.message.focus(); return; }
    const fd = new FormData(f);
    if (!fd.get("h-captcha-response")) { st.textContent = "Please complete the check above the Send button."; return; }
    fd.append("access_key", FEEDBACK.key); fd.append("subject", "Timbient Modules feedback"); fd.append("from_name", "Timbient Modules");
    if (details && $("fbincl").checked) fd.append("app_details", details);
    send.disabled = true; st.textContent = "Sending…";
    try {
      const r = await fetch(FEEDBACK.endpoint, { method: "POST", body: fd, headers: { Accept: "application/json" } });
      const j = await r.json().catch(() => ({}));
      if (r.ok && j.success !== false) { st.textContent = "Thanks! Your message has been sent."; f.reset(); if (window.hcaptcha) try { hcaptcha.reset(); } catch (_) {} setTimeout(close, 1800); }
      else st.textContent = "That didn't send (" + (j.message || ("error " + r.status)) + "). Please try again.";
    } catch (err) { st.textContent = "That didn't send. Check your connection and try again."; }
    send.disabled = false;
  });
})();
</script>
</body>
</html>
