# Builds Timbient Modules for Mac, Windows and Linux on every push to main,
# and puts the results on the "latest" release so they can be downloaded directly.
name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            name: mac
          - os: windows-latest
            name: windows
          - os: ubuntu-22.04
            name: windows32
          - os: ubuntu-22.04
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux libraries for SDL
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpulse-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev libdbus-1-dev libudev-dev
      - name: "Configure (Mac, one app for both Intel and Apple Silicon)"
        if: matrix.name == 'mac'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=x86_64;arm64"
      - name: "MinGW, for the 32-bit Windows version (it still supports Windows 7)"
        if: matrix.name == 'windows32'
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 zip
      - name: "Configure (Windows 32-bit, for older computers)"
        if: matrix.name == 'windows32'
        run: cmake -B build -DCMAKE_TOOLCHAIN_FILE=cmake/mingw32.cmake -DCMAKE_BUILD_TYPE=Release
      - name: Configure
        if: matrix.name != 'mac' && matrix.name != 'windows32'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: "Test: what each MI voice costs, and that all modules make clean sound"
        if: matrix.name == 'linux'
        run: |
          cmake -B build-tests -DCMAKE_BUILD_TYPE=Release -DTIMBIENT_APP=OFF -DTIMBIENT_TESTS=ON
          cmake --build build-tests --parallel --target timbient_micost timbient_allmods
          ./build-tests/timbient_micost
          ./build-tests/timbient_allmods
      - name: Package (Mac)
        if: matrix.name == 'mac'
        run: |
          codesign --force --deep --sign - "build/Timbient Modules.app"
          mkdir -p pkg && cp -R "build/Timbient Modules.app" pkg/ && cp CREDITS.md pkg/
          ditto -c -k pkg Timbient-Modules-Mac.zip
      - name: "Check it runs on Windows 7 (32-bit)"
        if: matrix.name == 'windows32'
        run: python3 tools/check_win7.py "build/Timbient Modules.exe"
      - name: Package (Windows 32-bit)
        if: matrix.name == 'windows32'
        run: |
          mkdir -p "pkg/Timbient Modules" && cp "build/Timbient Modules.exe" CREDITS.md "pkg/Timbient Modules/"
          (cd pkg && zip -r ../Timbient-Modules-Windows-32bit.zip "Timbient Modules")
      - name: Package (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "pkg/Timbient Modules" | Out-Null
          Copy-Item "build/Release/Timbient Modules.exe" "pkg/Timbient Modules/"
          Copy-Item "CREDITS.md" "pkg/Timbient Modules/"
          Compress-Archive -Path "pkg/Timbient Modules" -DestinationPath Timbient-Modules-Windows.zip
      - name: Package (Linux)
        if: matrix.name == 'linux'
        run: |
          mkdir -p "pkg/timbient-modules" && cp build/timbient-modules CREDITS.md pkg/timbient-modules/
          tar -czf Timbient-Modules-Linux.tar.gz -C pkg timbient-modules
      - uses: actions/upload-artifact@v4
        with:
          name: timbient-${{ matrix.name }}
          path: Timbient-Modules-*
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Which version this is
        id: ver
        run: |
          echo "version=$(grep -o 'VERSION = "[^"]*"' src/app/main.cpp | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u '+%-d %B %Y, %H:%M UTC')" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Update the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Timbient Modules ${{ steps.ver.outputs.version }}"
          prerelease: true
          make_latest: true
          body: |
            **Version ${{ steps.ver.outputs.version }}**, built ${{ steps.ver.outputs.date }}.

            Built automatically from the newest code. Mac: unzip, move to Applications, then see the README for the one-time Terminal step.
          files: dist/*
